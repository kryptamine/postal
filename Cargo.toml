[package]
name = "postal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven terminal mail client that reads one IMAP mailbox"
publish = false

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22.1"
charset = "0.1.5"
chrono = "0.4.45"
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
html2text = { version = "0.17.4", features = ["css"] }
html5ever = "0.40.1"
keyring = "4.2.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
libc = "0.2.191"
mail-parser = { version = "0.11", features = ["full_encoding"] }
nucleo-matcher = "0.3.1"
quoted_printable = "0.5.2"
ratatui = "0.30"
rfc2047-decoder = "1.1.2"
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.2.1"
toml_edit = "0.25"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.12"

[features]
# Test-only: counts allocations per frame, see docs/adr/0001-performance-budget.md.
alloc-count = []

[dev-dependencies]
imap-codec = { version = "=2.0.0-alpha.10", features = ["ext_condstore_qresync"] }
imap-next = "0.3.4"
insta = "1.49.0"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
tempfile = "3.27.0"
termlens = "0.11.10"

[[test]]
name = "frame_allocations"
required-features = ["alloc-count"]

[lints.rust]
let_underscore_drop = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
string_slice = "deny"
let_underscore_must_use = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
as_conversions = "deny"
map_err_ignore = "deny"
clone_on_ref_ptr = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Postal runs on a current-thread runtime, so no future needs to be Send.
future_not_send = "allow"

[build-dependencies]
cc = { version = "1.11.2", features = ["parallel"] }
