name: Bug report
description: Postal does something wrong or crashes.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Postal did instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Thread with an attachment
        2. Press ...
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Postal version or commit
      description: The release, or `git rev-parse --short HEAD` of the checkout you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and terminal
      placeholder: macOS 26.1, Ghostty 1.3
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Mail provider
      options: [Google, iCloud, Other IMAP server]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The relevant lines of `~/.local/state/postal/postal.log`. Check them for
        addresses and subjects you would rather not post.
      render: text
