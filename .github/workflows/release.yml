name: Release

on:
  push:
    branches: [main]
  # A pull request that changes how the archives are made builds, signs and
  # checks them, without a release to upload to.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/sign-macos.sh
      - Makefile
      - build.rs

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Not GITHUB_TOKEN: its PRs start no CI, and the ruleset requires the ci check.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  build:
    needs: release-please
    # Secrets reach no pull request from a fork, so one cannot sign.
    if: >-
      !cancelled() && (needs.release-please.outputs.created == 'true' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # The oldest runner sets the glibc a Linux binary needs.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      NAME: postal-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: make dist TARGET=${{ matrix.target }} SIGN=scripts/sign-macos.sh
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # An empty CXXSTDLIB stops cc linking libstdc++ dynamically; the link
      # args put the static one last, so no user needs a matching C++ runtime.
      - if: runner.os == 'Linux'
        run: make dist TARGET=${{ matrix.target }}
        env:
          CXXSTDLIB: ""
          RUSTFLAGS: -C link-arg=-Wl,-Bstatic -C link-arg=-lstdc++ -C link-arg=-Wl,-Bdynamic
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.tar.gz*
          if-no-files-found: error

  # Each archive runs on a runner that never built it, before it is published.
  verify:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          # The floor the README promises: glibc 2.35, no libstdc++ needed.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, container: "ubuntu:22.04" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "ubuntu:22.04" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      NAME: postal-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.NAME }}
      - run: sha256sum -c "$NAME.tar.gz.sha256" || shasum -a 256 -c "$NAME.tar.gz.sha256"
      - run: tar -xzf "$NAME.tar.gz"
      - run: ./"$NAME"/postal --version
      - if: runner.os == 'Linux'
        run: "! ldd \"$NAME/postal\" | grep libstdc++"
      - if: runner.os == 'macOS'
        run: spctl --assess --type install -vvv "$NAME/postal"

  publish:
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release upload "$TAG" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
