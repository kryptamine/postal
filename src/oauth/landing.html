<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postal · {{title}}</title>
<style>
:root {
  --bg: #f7f6f2; --fg: #1d1d1b; --muted: #6b6a65;
  --back: #d9def5; --front: #c3ccf2; --flap: #b3bfee; --paper: #ffffff; --line: #d4d3cd;
  --ok: #2f4fd8; --err: #c4352b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b19; --fg: #ecebe6; --muted: #9c9b95;
    --back: #2a2f45; --front: #353d5e; --flap: #414a70; --paper: #ecebe6; --line: #b9b8b2;
    --ok: #6d86f2; --err: #ef6a5f;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg); color: var(--fg); text-align: center;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
}
svg.mail { width: 220px; height: auto; overflow: visible; margin-bottom: 28px; }
svg.mail * { transform-box: fill-box; }
.back { fill: var(--back); }
.front { fill: var(--front); }
.flap { fill: var(--flap); }
.paper { fill: var(--paper); }
.line { stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
.seal { fill: var(--{{tone}}); stroke: var(--bg); stroke-width: 5; }
.mark { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.spark { fill: var(--{{tone}}); }
h1 { margin: 0 0 10px; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }
p { margin: 0; max-width: 420px; color: var(--muted); }
.brand { margin-top: 56px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }

/* The letter goes in, the flap folds over it, then the seal lands. */
.letter { animation: post 0.8s cubic-bezier(.5, 0, .3, 1) 0.3s both; }
.open { transform-origin: 50% 100%; animation: fold-up 0.2s ease-in 1.1s both; }
.shut { transform-origin: 50% 0%; animation: fold-down 0.25s ease-out 1.3s both; }
.badge { transform-origin: 50% 50%; animation: pop 0.45s cubic-bezier(.3, 1.6, .5, 1) 1.6s both; }
.mark { stroke-dasharray: 40; animation: draw 0.35s ease-out 1.95s both; }
.spark { transform-origin: 50% 50%; opacity: 0; animation: burst 0.7s ease-out 1.75s both; }
.text { animation: rise 0.5s ease-out 2s both; }
@keyframes post { from { transform: translateY(-76px); } to { transform: translateY(0); } }
@keyframes fold-up { from { transform: scaleY(1); } to { transform: scaleY(0); } }
@keyframes fold-down { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes draw { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
@keyframes burst {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Refused: the letter stays out, the flap stays open, the envelope shakes. */
.err .letter { animation: none; transform: translateY(-76px); }
.err .open { animation: none; }
.err .shut { animation: none; transform: scaleY(0); }
.err .spark { display: none; }
.err .badge { animation-delay: 0.3s; }
.err .mark { animation-delay: 0.65s; }
.err .text { animation-delay: 0.7s; }
.err svg.mail { animation: shake 0.5s ease-in-out 0.75s; }
@keyframes shake {
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; }
}
</style>
</head>
<body class="{{tone}}">
  <svg class="mail" viewBox="0 -40 180 170" aria-hidden="true">
    <rect class="back" x="10" y="30" width="160" height="96" rx="10"/>
    <path class="flap open" d="M10 30 L90 -18 L170 30 Z"/>
    <g class="letter">
      <rect class="paper" x="30" y="38" width="120" height="80" rx="6"/>
      <line class="line" x1="46" y1="56" x2="134" y2="56"/>
      <line class="line" x1="46" y1="70" x2="134" y2="70"/>
      <line class="line" x1="46" y1="84" x2="106" y2="84"/>
    </g>
    <path class="front" d="M10 30 L90 84 L170 30 V116 A10 10 0 0 1 160 126 H20 A10 10 0 0 1 10 116 Z"/>
    <path class="flap shut" d="M10 30 L90 92 L170 30 Z"/>
    <circle class="spark" cx="150" cy="108" r="4" style="--dx: 26px; --dy: -30px"/>
    <circle class="spark" cx="150" cy="108" r="3" style="--dx: 38px; --dy: 4px"/>
    <circle class="spark" cx="150" cy="108" r="3.5" style="--dx: 14px; --dy: 34px"/>
    <circle class="spark" cx="150" cy="108" r="3" style="--dx: -30px; --dy: -24px"/>
    <g class="badge">
      <circle class="seal" cx="150" cy="108" r="24"/>
      <path class="mark" d="{{mark}}"/>
    </g>
  </svg>
  <div class="text">
    <h1>{{title}}</h1>
    <p>{{detail}}</p>
  </div>
  <div class="brand text">POSTAL</div>
</body>
</html>
